# Shipmater API (Laravel) on Railway.
# In the Railway service settings set Root Directory = /api so this file and the
# Dockerfile are picked up. Postgres is a separate Railway service — see DEPLOY.md.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# Laravel's built-in health route (bootstrap/app.php → health: '/up').
healthcheckPath = "/up"
# First boot runs all migrations + reference seeders before serving.
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
